name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python sources (catches syntax errors without deps)
        run: python -m compileall -q src scripts libs

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the locked dependencies with CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install "poetry==2.1.3" poetry-plugin-export
          poetry export --with dev --without-hashes -f requirements.txt -o requirements-ci.txt
          grep -vE '^(torch|torchvision|triton|glasses-detector)[ =@;]|^nvidia-' requirements-ci.txt > requirements-ci-cpu.txt
          pip install $(grep -E '^(torch|torchvision)==' requirements-ci.txt | cut -d' ' -f1) --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci-cpu.txt
          # The vendored classifier; --no-deps because its only requirements (tqdm, torch, torchvision) are installed above
          pip install --no-deps ./libs/glasses-detector

      - name: Lint
        run: ruff check src scripts tests

      - name: Unit tests (CPU only, offline, no data)
        run: pytest -q
